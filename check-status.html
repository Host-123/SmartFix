<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix | Check Booking Status</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
}

.card{
  width:360px;
  padding:25px;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(15px);
  border-radius:16px;
  border:1px solid rgba(255,255,255,.3);
  text-align:center;
}

input,button{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:none;
}

input{
  background:rgba(255,255,255,.28);
  color:#fff;
}
input::placeholder{
  color:#f1f5f9;
}

button{
  background:#0d6efd;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.status-card{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:rgba(255,255,255,.15);
}

.badge{
  padding:4px 12px;
  border-radius:20px;
  color:#fff;
  font-size:13px;
}
</style>
</head>

<body>

<div class="card">
  <h2>📌 Check Booking Status</h2>

  <input id="phone" placeholder="Enter Phone Number">
  <button onclick="checkStatus()">Check Status</button>

  <div id="result"></div>

  <br>
  <a href="booking.html" style="color:#bcdcff;text-decoration:none;">⬅ Back to Booking</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getFirestore, collection, query, where, getDocs
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const result = document.getElementById("result");

/* CHECK STATUS */
window.checkStatus = async ()=>{
  const phone = document.getElementById("phone").value.trim();
  result.innerHTML="";

  if(!phone){
    result.innerHTML="❌ Enter phone number";
    return;
  }

  const q = query(collection(db,"bookings"), where("phone","==",phone));
  const snap = await getDocs(q);

  if(snap.empty){
    result.innerHTML="❌ No booking found";
    return;
  }

  snap.forEach(d=>{
    const b=d.data();
    const color=b.status==="Completed"?"green":"orange";

    result.innerHTML+=`
      <div class="status-card">
        <b>${b.service}</b><br>
        ${b.date} ${b.time}<br>
        <span class="badge" style="background:${color}">
          ${b.status}
        </span>
      </div>
    `;
  });
};
</script>

</body>
</html>
