<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix | Admin Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(120deg,#0f2027,#203a43,#2c5364);
}

.card{
  width:360px;
  padding:30px;
  text-align:center;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(15px);
  border-radius:16px;
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
}

input,button{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:none;
}

/* input + placeholder */
input{
  background:rgba(255,255,255,.25);
  color:#ffffff;
}
input::placeholder{
  color:#f1f5f9;
  opacity:1;
  font-weight:500;
}
input:focus{
  outline:none;
  box-shadow:0 0 0 2px rgba(13,110,253,.6);
}

button{
  background:#0d6efd;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

#error{
  margin-top:10px;
  color:#ffb3b3;
}
</style>
</head>

<body>

<div class="card">
  <h2>🔐 SmartFix Admin Login</h2>

  <input type="email" id="email" placeholder="Admin Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="adminLogin()">Login</button>

  <div id="error"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* ===== ADMIN EMAIL LIST ===== */
const ADMINS = [
  "student.student.on@gmail.com"
];

/* ===== ADMIN LOGIN ===== */
window.adminLogin = ()=>{
  signInWithEmailAndPassword(auth,email.value,password.value)
    .then((cred)=>{
      if(ADMINS.includes(cred.user.email)){
        // ✅ CORRECT REDIRECT
        location.href = "admin.html";
      }else{
        error.textContent = "❌ You are not an admin";
        signOut(auth);
      }
    })
    .catch(e=>{
      error.textContent = "❌ " + e.message;
    });
};
</script>

</body>
</html>
