<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix Admin Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

/* ===== BACKGROUND ===== */
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(120deg,#0f2027,#203a43,#2c5364);
}

/* ===== LOGIN BOX (GLASS) ===== */
.login-box{
  width:360px;
  padding:30px;

  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);

  border-radius:16px;
  border:1px solid rgba(255,255,255,0.3);
  box-shadow:0 8px 32px rgba(0,0,0,0.35);

  color:#fff;
  animation: fadeUp 0.8s ease;
}

/* ===== TITLE ===== */
.login-box h2{
  text-align:center;
  margin-bottom:20px;
  color:#fff;
}

.login-box h2 span{
  display:inline-block;
  margin-right:8px;
  animation:pulse 1.5s infinite;
}

/* ===== INPUT ===== */
.login-box input{
  width:100%;
  padding:12px;
  margin:10px 0;

  border-radius:8px;
  border:1px solid rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.25);
  color:#fff;
  outline:none;
}

.login-box input::placeholder{
  color:#eaeaea;
}

/* ===== BUTTON ===== */
.login-box button{
  width:100%;
  padding:12px;
  margin-top:15px;

  border:none;
  border-radius:8px;
  cursor:pointer;

  background: rgba(13,110,253,0.85);
  color:#fff;
  font-weight:bold;
}

.login-box button:hover{
  background: rgba(13,110,253,1);
}

/* ===== ERROR TEXT ===== */
#error{
  margin-top:10px;
  text-align:center;
  color:#ffb3b3;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(30px) scale(0.95);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

@keyframes pulse{
  0%{transform:scale(1);}
  50{transform:scale(1.15);}
  100%{transform:scale(1);}
}

/* ===== MOBILE ===== */
@media(max-width:480px){
  .login-box{
    width:90%;
    padding:25px;
  }
}
</style>
</head>

<body>

<div class="login-box">
  <h2><span>🔐</span>SmartFix Admin Login</h2>

  <input type="email" id="email" placeholder="Admin Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p id="error"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* ✅ ADMIN LIST */
const ADMINS = ["student.student.on@gmail.com"];

/* LOGIN FUNCTION */
window.login = ()=>{
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const error = document.getElementById("error");

  signInWithEmailAndPassword(auth,email,password)
  .then(res=>{
    if(!ADMINS.includes(res.user.email)){
      error.textContent="❌ You are not an admin";
      return;
    }
    location.href="admin-dashboard.html";
  })
  .catch(err=>{
    error.textContent="❌ "+err.message;
  });
};
</script>

</body>
</html>
