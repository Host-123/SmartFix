<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix Register</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(120deg,#0f2027,#203a43,#2c5364);
}
.box{
  width:450px;
  margin:80px auto;
  background:#fff;
  padding:30px;
  border-radius:12px;
}
h2{text-align:center}
input,button{
  width:100%;
  padding:12px;
  margin-top:12px;
}
button{
  background:#198754;
  color:#fff;
  border:none;
  border-radius:6px;
}
.msg{margin-top:10px}
</style>
</head>
<body>

<div class="box">
  <h2>🆕 New Registration</h2>

  <input id="name" placeholder="Full Name">
  <input id="phone" placeholder="Phone Number">
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="register()">Create Account</button>

  <div class="msg" id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import { getFirestore, setDoc, doc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
  storageBucket: "smartfix-computer-service.appspot.com",
  messagingSenderId: "393720657887",
  appId: "1:393720657887:web:4501c751f97fd75122766a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.register = function(){
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  createUserWithEmailAndPassword(auth,email,pass)
    .then(async(res)=>{
      await setDoc(doc(db,"users",res.user.uid),{
        name, phone, email
      });
      document.getElementById("msg").innerText="✅ Registration successful!";
      setTimeout(()=>location.href="dashboard.html",1500);
    })
    .catch(e=>{
      document.getElementById("msg").innerText=e.message;
    });
}
</script>

</body>
</html>
