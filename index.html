<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix Computer Service</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}
.header{
  background:#1877f2;
  color:#fff;
  padding:25px;
  text-align:center;
}
.container{
  max-width:520px;
  margin:40px auto;
  background:#fff;
  padding:25px;
  border-radius:10px;
}
.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}
.tabs button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}
.active{
  background:#1877f2;
  color:#fff;
}
input{
  width:100%;
  padding:10px;
  margin:8px 0;
}
.btn{
  background:#1877f2;
  color:#fff;
  border:none;
  padding:12px;
  width:100%;
  border-radius:6px;
  cursor:pointer;
}
.msg{
  margin-top:10px;
  font-weight:bold;
}
.hide{display:none;}
</style>
</head>

<body>

<div class="header">
  <h1>💻 SmartFix Computer Service</h1>
  <p>Fast • Trusted • Affordable Repair</p>
</div>

<div class="container">

<div class="tabs">
  <button id="loginTab" class="active" onclick="showLogin()">🔐 Existing Login</button>
  <button id="regTab" onclick="showRegister()">🆕 New Register</button>
</div>

<!-- LOGIN -->
<div id="loginBox">
  <h3>Login</h3>
  <input id="loginEmail" placeholder="Email">
  <input id="loginPass" type="password" placeholder="Password">
  <button class="btn" onclick="login()">Login</button>
</div>

<!-- REGISTER -->
<div id="registerBox" class="hide">
  <h3>New User Register</h3>
  <input id="regName" placeholder="Full Name">
  <input id="regPhone" placeholder="Phone Number">
  <input id="regEmail" placeholder="Email">
  <input id="regPass" type="password" placeholder="Password">
  <button class="btn" onclick="register()">Register</button>
</div>

<div id="msg" class="msg"></div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
  storageBucket: "smartfix-computer-service.appspot.com",
  messagingSenderId: "393720657887",
  appId: "1:393720657887:web:4501c751f97fd75122766a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.showLogin = ()=>{
  loginBox.classList.remove("hide");
  registerBox.classList.add("hide");
  loginTab.classList.add("active");
  regTab.classList.remove("active");
  msg.innerText="";
}

window.showRegister = ()=>{
  loginBox.classList.add("hide");
  registerBox.classList.remove("hide");
  regTab.classList.add("active");
  loginTab.classList.remove("active");
  msg.innerText="";
}

window.register = ()=>{
  createUserWithEmailAndPassword(auth, regEmail.value, regPass.value)
  .then(()=>{
    msg.style.color="green";
    msg.innerText="✅ Registration successful! Now login.";
    showLogin();
  })
  .catch(e=>{
    msg.style.color="red";
    msg.innerText=e.message;
  });
}

window.login = ()=>{
  signInWithEmailAndPassword(auth, loginEmail.value, loginPass.value)
  .then(()=>{
    window.location.href="booking.html"; // next page
  })
  .catch(e=>{
    msg.style.color="red";
    msg.innerText=e.message;
  });
}
</script>

</body>
</html>
