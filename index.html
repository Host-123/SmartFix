<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix | Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

/* ===== PAGE BACKGROUND ===== */
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(120deg,#0f2027,#203a43,#2c5364);
  animation: fadePage .8s ease-in;
}

/* PAGE FADE */
@keyframes fadePage{
  from{opacity:0}
  to{opacity:1}
}

/* ===== LOGIN CARD ===== */
.card{
  width:360px;
  padding:30px;
  text-align:center;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(15px);
  border-radius:16px;
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
  animation: slideUp .9s ease-out;
}

/* CARD SLIDE */
@keyframes slideUp{
  from{
    opacity:0;
    transform:translateY(40px) scale(.95);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* ===== TEXT ===== */
h2{margin-bottom:5px;}
p{
  font-size:13px;
  opacity:.85;
  margin-bottom:20px;
}

/* ===== INPUTS ===== */
input,button{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:none;
}

input{
  background:rgba(255,255,255,.28);
  color:#fff;
}
input::placeholder{
  color:#f1f5f9;
  opacity:1;
}
input:focus{
  outline:none;
  box-shadow:0 0 0 2px rgba(13,110,253,.6);
}

/* ===== BUTTON ===== */
button{
  background:#28a745;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  transition:all .25s ease;
}
button:hover{
  transform:scale(1.04);
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}

/* ===== LINK ===== */
a{
  display:block;
  margin-top:12px;
  color:#bcdcff;
  text-decoration:none;
}

/* ===== ERROR ===== */
#error{
  margin-top:10px;
  color:#ffb3b3;
}
</style>
</head>

<body>

<div class="card">
  <h2>🔧 Smartfix-computer-service</h2>
  <p>Computer Service Booking System</p>

  <input type="email" id="email" placeholder="Email" autocomplete="off">
  <input type="password" id="password" placeholder="Password" autocomplete="new-password">

  <button onclick="login()">Login</button>

  <a href="customer-register.html">Create New Account</a>

  <div id="error"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* LOGIN */
window.login = ()=>{
  signInWithEmailAndPassword(auth,email.value,password.value)
    .then(()=>location.href="booking.html")
    .catch(e=>error.textContent="❌ "+e.message);
};
</script>

</body>
</html>
