<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix Computer Service</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(120deg,#141e30,#243b55);
}

.login-box{
  width:360px;
  padding:30px;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(15px);
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.3);
  box-shadow:0 8px 32px rgba(0,0,0,0.35);
  color:#fff;
}
.login-box h2{
  text-align:center;
  margin-bottom:20px;
}
.login-box input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.25);
  color:#fff;
}
.login-box button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#28a745;
  color:#fff;
  font-weight:bold;
}
#error{
  text-align:center;
  margin-top:10px;
  color:#ffb3b3;
}
</style>
</head>

<body>

<div class="login-box">
  <h2>👤 SmartFix Computer Service</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <p id="error"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = ()=>{
  const email = email.value;
  const password = password.value;
  const error = document.getElementById("error");

  signInWithEmailAndPassword(auth,email,password)
    .then(()=>{
      // ✅ correct redirect
      location.href = "booking.html";
    })
    .catch(err=>{
      error.textContent = "❌ " + err.message;
    });
};
</script>

</body>
</html>
