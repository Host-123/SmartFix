<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SmartFix Computer Service</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
      color:#333;
    }
    header{
      background:#0d6efd;
      color:#fff;
      padding:30px;
      text-align:center;
    }
    .box{
      max-width:700px;
      margin:40px auto;
      background:#fff;
      border-radius:12px;
      padding:30px;
      box-shadow:0 10px 30px rgba(0,0,0,.3);
    }
    h2{margin-top:0}
    input{
      width:100%;
      padding:12px;
      margin:10px 0;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:15px;
    }
    button{
      padding:10px 18px;
      border:none;
      border-radius:20px;
      background:#0d6efd;
      color:#fff;
      font-size:14px;
      cursor:pointer;
      margin-right:10px;
    }
    button:hover{opacity:.9}
    .msg{
      margin-top:15px;
      font-weight:bold;
    }
    footer{
      text-align:center;
      color:#fff;
      padding:20px;
      font-size:14px;
    }
  </style>
</head>

<body>

<header>
  <h1>💻 SmartFix Computer Service</h1>
  <p>Fast • Trusted • Affordable Repair & Support</p>
</header>

<div class="box">
  <h2>Login / New Register</h2>

  <!-- REGISTER -->
  <input id="name" placeholder="Full Name (for new user)">
  <input id="phone" placeholder="Phone Number (for new user)">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="register()">New Register</button>

  <div id="msg" class="msg"></div>
</div>

<footer>
  © 2026 SmartFix Computer Service • Powered by GitHub Pages + Firebase
</footer>

<!-- 🔥 FIREBASE CDN -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
    from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } 
    from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

  // 🔑 YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
    authDomain: "smartfix-computer-service.firebaseapp.com",
    projectId: "smartfix-computer-service",
    storageBucket: "smartfix-computer-service.firebasestorage.app",
    messagingSenderId: "393720657887",
    appId: "1:393720657887:web:4501c751f97fd75122766a"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ✅ REGISTER
  window.register = async () => {
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      const userCred = await createUserWithEmailAndPassword(auth,email,password);
      await setDoc(doc(db,"users",userCred.user.uid),{
        name, phone, email, created:new Date()
      });
      msg.innerText = "✅ Registration successful!";
      msg.style.color="green";
    } catch(e){
      msg.innerText = "❌ " + e.message;
      msg.style.color="red";
    }
  };

  // ✅ LOGIN
  window.login = async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      await signInWithEmailAndPassword(auth,email,password);
      msg.innerText = "✅ Login successful!";
      msg.style.color="green";
    } catch(e){
      msg.innerText = "❌ " + e.message;
      msg.style.color="red";
    }
  };
</script>

</body>
</html>
