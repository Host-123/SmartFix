<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix | Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;}
body{
  margin:0;height:100vh;
  display:flex;justify-content:center;align-items:center;
  background:linear-gradient(120deg,#141e30,#243b55);
}
.card{
  width:360px;padding:30px;text-align:center;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(15px);
  border-radius:16px;border:1px solid rgba(255,255,255,.3);
  color:#fff;
}
input,button{
  width:100%;padding:12px;margin:10px 0;
  border-radius:8px;border:none;
}
input{background:rgba(255,255,255,.25);color:#fff;}
button{background:#28a745;color:#fff;font-weight:bold;cursor:pointer;}
a{color:#bcdcff;text-decoration:none;display:block;margin-top:10px;}
#error{margin-top:10px;color:#ffb3b3;}
</style>
</head>

<body>
<div class="card">
  <h2>🔐 Login</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <a href="customer-register.html">Smartfix-Computer-Service</a>
  <div id="error"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = ()=>{
  signInWithEmailAndPassword(auth,email.value,password.value)
    .then(()=>location.href="booking.html")
    .catch(e=>error.textContent="❌ "+e.message);
};
</script>
</body>
</html>
