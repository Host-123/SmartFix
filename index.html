<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartFix Computer Service</title>
  <style>
    body{
      margin:0; font-family: Arial, sans-serif;
      background: linear-gradient(120deg,#061a2b,#0b3b57,#061a2b);
      color:#111;
      display:flex;
      justify-content:center;
      padding:30px;
    }
    .card{
      width:900px;
      background:#fff;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.3);
      overflow:hidden;
    }
    header{
      padding:25px;
      background: linear-gradient(90deg,#0d47a1,#00acc1);
      color:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    header h1{margin:0;font-size:26px;}
    header p{margin:5px 0 0; opacity:.9}
    .tabs{
      display:flex;
      gap:10px;
      padding:15px;
      background:#f3f7fb;
      justify-content:center;
    }
    .tabs button{
      padding:10px 20px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-weight:bold;
      background:#e0e0e0;
    }
    .tabs button.active{
      background:#0d47a1;
      color:white;
    }
    .content{
      padding:25px;
    }
    .box{
      background:#f8fbff;
      padding:20px;
      border-radius:15px;
      margin-bottom:20px;
      border:1px solid #e1e7f0;
    }
    h2{margin-top:0;}
    input, select, textarea{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid #ccc;
      margin-top:10px;
      font-size:15px;
    }
    textarea{height:90px; resize:none;}
    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }
    .btn{
      margin-top:15px;
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      background:linear-gradient(90deg,#0d47a1,#00acc1);
      color:white;
    }
    .msg{
      margin-top:10px;
      font-weight:bold;
    }
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:15px;
    }
    .logoutBtn{
      background:#e53935;
      color:white;
      padding:10px 15px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
    }
    footer{
      text-align:center;
      padding:15px;
      background:#f3f7fb;
      color:#333;
      font-size:14px;
    }
    .hide{display:none;}
  </style>
</head>

<body>
  <div class="card">
    <header>
      <div>
        <h1>💻 SmartFix Computer Service</h1>
        <p>Fast • Trusted • Affordable Repair & Support</p>
      </div>
      <div>
        <button class="logoutBtn hide" id="logoutBtn">Logout</button>
      </div>
    </header>

    <div class="tabs">
      <button id="tabRegister" class="active" onclick="showTab('register')">Register</button>
      <button id="tabLogin" onclick="showTab('login')">Login</button>
      <button id="tabBooking" onclick="showTab('booking')">Booking</button>
    </div>

    <div class="content">

      <!-- REGISTER -->
      <div id="register" class="box">
        <h2>📝 Create Account</h2>
        <div class="row">
          <input id="regName" type="text" placeholder="Full Name">
          <input id="regPhone" type="text" placeholder="Phone Number">
        </div>
        <input id="regEmail" type="email" placeholder="Email Address">
        <input id="regPass" type="password" placeholder="Password">
        <button class="btn" onclick="registerUser()">Register</button>
        <div class="msg" id="regMsg"></div>
      </div>

      <!-- LOGIN -->
      <div id="login" class="box hide">
        <h2>🔐 Login</h2>
        <input id="logEmail" type="email" placeholder="Email Address">
        <input id="logPass" type="password" placeholder="Password">
        <button class="btn" onclick="loginUser()">Login</button>
        <div class="msg" id="logMsg"></div>
      </div>

      <!-- BOOKING -->
      <div id="booking" class="box hide">
        <div class="topbar">
          <h2>📅 Book a Service</h2>
          <div><b>Logged in as:</b> <span id="userEmail">---</span></div>
        </div>

        <input id="bkName" type="text" placeholder="Customer Name">
        <input id="bkPhone" type="text" placeholder="Customer Phone">
        <input id="bkAddress" type="text" placeholder="Customer Address">

        <select id="bkService">
          <option value="">Select Service Type</option>
          <option>PC Repair</option>
          <option>Laptop Repair</option>
          <option>Windows Install</option>
          <option>Printer Setup</option>
        </select>

        <textarea id="bkDetails" placeholder="Problem details..."></textarea>

        <div class="row">
          <input id="bkDate" type="date">
          <input id="bkTime" type="time">
        </div>

        <button class="btn" onclick="submitBooking()">Submit Booking</button>
        <div class="msg" id="bkMsg"></div>

        <p style="margin-top:15px;">
          🔥 Admin panel: <a href="admin.html" target="_blank">Open Admin Dashboard</a>
        </p>
      </div>

    </div>

    <footer>
      © 2026 SmartFix Computer Service • Powered by GitHub Pages + Firebase
    </footer>
  </div>

  <!-- Firebase (Module Script) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } 
      from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } 
      from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    // 🔥 Your Firebase Config (yours)
    const firebaseConfig = {
      apiKey: "AIzaSyDL2OFxYzmXKUp5edh6QtD2f5gkb6oZAv4",
      authDomain: "smartfix-computer-service.firebaseapp.com",
      projectId: "smartfix-computer-service",
      storageBucket: "smartfix-computer-service.firebasestorage.app",
      messagingSenderId: "393720657887",
      appId: "1:393720657887:web:4501c751f97fd75122766a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // UI Helpers
    window.showTab = function(tab){
      document.getElementById("register").classList.add("hide");
      document.getElementById("login").classList.add("hide");
      document.getElementById("booking").classList.add("hide");

      document.getElementById(tab).classList.remove("hide");

      document.getElementById("tabRegister").classList.remove("active");
      document.getElementById("tabLogin").classList.remove("active");
      document.getElementById("tabBooking").classList.remove("active");

      if(tab==="register") document.getElementById("tabRegister").classList.add("active");
      if(tab==="login") document.getElementById("tabLogin").classList.add("active");
      if(tab==="booking") document.getElementById("tabBooking").classList.add("active");
    }

    // Register
    window.registerUser = async function(){
      const name = document.getElementById("regName").value.trim();
      const phone = document.getElementById("regPhone").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const pass = document.getElementById("regPass").value.trim();
      const msg = document.getElementById("regMsg");

      msg.innerHTML = "";

      if(!name || !phone || !email || !pass){
        msg.style.color="red";
        msg.innerHTML="❌ Please fill all fields!";
        return;
      }

      try{
        await createUserWithEmailAndPassword(auth, email, pass);
        msg.style.color="green";
        msg.innerHTML="✅ Registration successful! Now Login.";
        showTab("login");
      }catch(e){
        msg.style.color="red";
        msg.innerHTML="❌ " + e.message;
      }
    }

    // Login
    window.loginUser = async function(){
      const email = document.getElementById("logEmail").value.trim();
      const pass = document.getElementById("logPass").value.trim();
      const msg = document.getElementById("logMsg");

      msg.innerHTML="";

      try{
        await signInWithEmailAndPassword(auth, email, pass);
        msg.style.color="green";
        msg.innerHTML="✅ Login successful!";
        showTab("booking");
      }catch(e){
        msg.style.color="red";
        msg.innerHTML="❌ " + e.message;
      }
    }

    // Booking Submit
    window.submitBooking = async function(){
      const user = auth.currentUser;
      const msg = document.getElementById("bkMsg");

      if(!user){
        msg.style.color="red";
        msg.innerHTML="❌ Please login first!";
        showTab("login");
        return;
      }

      const name = document.getElementById("bkName").value.trim();
      const phone = document.getElementById("bkPhone").value.trim();
      const address = document.getElementById("bkAddress").value.trim();
      const service = document.getElementById("bkService").value.trim();
      const details = document.getElementById("bkDetails").value.trim();
      const date = document.getElementById("bkDate").value;
      const time = document.getElementById("bkTime").value;

      if(!name || !phone || !address || !service || !details || !date || !time){
        msg.style.color="red";
        msg.innerHTML="❌ Please fill all booking fields!";
        return;
      }

      try{
        await addDoc(collection(db, "bookings"), {
          userEmail: user.email,
          name, phone, address, service, details, date, time,
          status: "Pending",
          createdAt: serverTimestamp()
        });

        msg.style.color="green";
        msg.innerHTML="✅ Booking submitted successfully!";

        // Clear fields
        document.getElementById("bkDetails").value="";
      }catch(e){
        msg.style.color="red";
        msg.innerHTML="❌ " + e.message;
      }
    }

    // Auth State
    onAuthStateChanged(auth, (user)=>{
      const logoutBtn = document.getElementById("logoutBtn");
      if(user){
        document.getElementById("userEmail").innerText = user.email;
        logoutBtn.classList.remove("hide");
      }else{
        document.getElementById("userEmail").innerText = "---";
        logoutBtn.classList.add("hide");
      }
    });

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", async ()=>{
      await signOut(auth);
      showTab("login");
    });
  </script>
</body>
</html>
