<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartFix Computer Service</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f4f6f9;
      padding:20px;
      text-align:center;
    }
    .box{
      max-width:800px;
      margin:auto;
      background:white;
      padding:25px;
      border-radius:16px;
      box-shadow:0 0 14px rgba(0,0,0,0.12);
      text-align:left;
    }
    h1{
      text-align:center;
      margin:0;
      color:#007bff;
    }
    .tagline{
      text-align:center;
      color:#333;
      margin-top:8px;
      margin-bottom:20px;
    }
    .tabs{
      display:flex;
      gap:10px;
      justify-content:center;
      margin-bottom:20px;
      flex-wrap:wrap;
    }
    .tabbtn{
      padding:10px 14px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
      background:#e9ecef;
    }
    .tabbtn.active{
      background:#007bff;
      color:white;
    }
    .section{
      display:none;
    }
    .section.active{
      display:block;
    }
    input, select, textarea{
      width:100%;
      padding:10px;
      margin:8px 0;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:15px;
    }
    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:12px;
      font-size:16px;
      cursor:pointer;
      background:#007bff;
      color:white;
      font-weight:bold;
    }
    button:hover{ background:#0056b3; }
    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    .info{
      margin-top:12px;
      background:#eaf3ff;
      padding:12px;
      border-radius:12px;
      font-size:14px;
      color:#222;
    }
    .success{
      background:#d1ffe2;
      border-left:6px solid #28a745;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>💻 SmartFix Computer Service</h1>
    <p class="tagline">Fast • Trusted • Affordable</p>

    <div class="tabs">
      <button class="tabbtn active" onclick="showTab('register')">Register</button>
      <button class="tabbtn" onclick="showTab('login')">Login</button>
      <button class="tabbtn" onclick="showTab('booking')">Booking</button>
    </div>

    <!-- Register -->
    <div id="register" class="section active">
      <h2>📝 Create Account</h2>
      <input type="text" placeholder="Full Name">
      <input type="text" placeholder="Phone Number">
      <input type="email" placeholder="Email Address">
      <input type="password" placeholder="Password">
      <button onclick="demoMsg('Registered successfully (Demo).')">Register</button>

      <div class="info">
        ⚠️ Demo Version: This registration is only for showing page design.
      </div>
    </div>

    <!-- Login -->
    <div id="login" class="section">
      <h2>🔑 Login</h2>
      <input type="email" placeholder="Email Address">
      <input type="password" placeholder="Password">
      <button onclick="demoMsg('Logged in successfully (Demo).')">Login</button>

      <div class="info">
        ⚠️ Demo Version: This login is only for showing page design.
      </div>
    </div>

    <!-- Booking -->
    <div id="booking" class="section">
      <h2>📅 Book a Service Slot</h2>

      <div class="row">
        <input type="text" placeholder="Customer Name">
        <input type="text" placeholder="Customer Phone">
      </div>

      <textarea placeholder="Full Address (House, Road, Area, City)"></textarea>

      <select>
        <option value="">Select Service Type</option>
        <option>PC Repair</option>
        <option>Laptop Repair</option>
        <option>Windows Installation</option>
        <option>Software Installation</option>
        <option>Printer Setup</option>
        <option>Networking / WiFi Setup</option>
      </select>

      <div class="row">
        <input type="date">
        <input type="time">
      </div>

      <textarea placeholder="Problem Details (Optional)"></textarea>

      <button onclick="demoMsg('Booking submitted (Demo).')">Confirm Booking</button>

      <div id="message" class="info success" style="display:none;"></div>
    </div>

  </div>

<script>
  function showTab(tabId){
    document.querySelectorAll(".tabbtn").forEach(btn => btn.classList.remove("active"));
    document.querySelectorAll(".section").forEach(sec => sec.classList.remove("active"));

    if(tabId === "register") document.querySelectorAll(".tabbtn")[0].classList.add("active");
    if(tabId === "login") document.querySelectorAll(".tabbtn")[1].classList.add("active");
    if(tabId === "booking") document.querySelectorAll(".tabbtn")[2].classList.add("active");

    document.getElementById(tabId).classList.add("active");
  }

  function demoMsg(text){
    const msg = document.getElementById("message");
    if(msg){
      msg.style.display = "block";
      msg.innerHTML = "✅ " + text;
    }else{
      alert("✅ " + text);
    }
  }
</script>

</body>
</html>
