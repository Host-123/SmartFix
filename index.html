<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix Computer Service</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#333;
}
header{
  background:#0d6efd;
  color:#fff;
  padding:20px;
  text-align:center;
}
.container{
  max-width:900px;
  margin:30px auto;
  background:#fff;
  border-radius:10px;
  padding:25px;
}
input,textarea,select{
  width:100%;
  padding:10px;
  margin:8px 0;
}
button{
  padding:10px 20px;
  border:none;
  border-radius:6px;
  background:#0d6efd;
  color:#fff;
  cursor:pointer;
}
button:hover{opacity:.9}
.hidden{display:none}
.status{
  padding:6px 10px;
  border-radius:12px;
  font-size:13px;
  color:#fff;
}
.Pending{background:orange}
.Completed{background:green}
.Cancelled{background:red}
</style>
</head>

<body>

<header>
  <h1>👤 SmartFix Computer Service</h1>
  <p>Customer Portal</p>
</header>

<div class="container">

<!-- LOGIN / REGISTER -->
<div id="authBox">
<h2>Login / New Register</h2>

<input id="name" placeholder="Full Name (only for new user)">
<input id="phone" placeholder="Phone Number (only for new user)">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<button onclick="register()">New Register</button>

<p id="msg"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
<h2>Welcome, <span id="userEmail"></span></h2>
<button onclick="logout()">Logout</button>

<hr>

<h3>📌 New Booking</h3>
<input id="b_name" placeholder="Name">
<input id="b_phone" placeholder="Phone">
<input id="b_address" placeholder="Address">

<select id="b_service">
<option>PC Repair</option>
<option>Laptop Repair</option>
<option>Windows Install</option>
<option>Printer Repair</option>
</select>

<textarea id="b_problem" placeholder="Problem details"></textarea>
<input type="date" id="b_date">
<input type="time" id="b_time">

<button onclick="submitBooking()">Submit Booking</button>

<hr>

<h3>🔔 Your Booking Status</h3>
<table border="1" width="100%" cellpadding="6">
<thead>
<tr>
<th>Service</th>
<th>Date</th>
<th>Status</th>
</tr>
</thead>
<tbody id="bookingList"></tbody>
</table>
</div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
 authDomain: "smartfix-computer-service.firebaseapp.com",
 projectId: "smartfix-computer-service",
 storageBucket: "smartfix-computer-service.firebasestorage.app",
 messagingSenderId: "393720657887",
 appId: "1:393720657887:web:4501c751f97fd75122766a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.register = async ()=>{
 try{
  await createUserWithEmailAndPassword(auth,email.value,password.value);
  msg.innerText="✅ Registration successful. Now login.";
  msg.style.color="green";
 }catch(e){
  msg.innerText=e.message;
  msg.style.color="red";
 }
}

window.login = async ()=>{
 try{
  const res = await signInWithEmailAndPassword(auth,email.value,password.value);
  authBox.classList.add("hidden");
  dashboard.classList.remove("hidden");
  userEmail.innerText=res.user.email;
  loadBookings(res.user.email);
 }catch(e){
  msg.innerText=e.message;
  msg.style.color="red";
 }
}

window.logout = async ()=>{
 await signOut(auth);
 location.reload();
}

window.submitBooking = async ()=>{
 await addDoc(collection(db,"bookings"),{
  name:b_name.value,
  phone:b_phone.value,
  address:b_address.value,
  service:b_service.value,
  problem:b_problem.value,
  date:b_date.value,
  time:b_time.value,
  userEmail:auth.currentUser.email,
  status:"Pending"
 });
 alert("Booking submitted");
 loadBookings(auth.currentUser.email);
}

async function loadBookings(email){
 bookingList.innerHTML="";
 const q=query(collection(db,"bookings"),where("userEmail","==",email));
 const snap=await getDocs(q);
 snap.forEach(d=>{
  const b=d.data();
  bookingList.innerHTML+=`
  <tr>
   <td>${b.service}</td>
   <td>${b.date}</td>
   <td><span class="status ${b.status}">${b.status}</span></td>
  </tr>`;
 });
}
</script>

</body>
</html>
