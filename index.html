<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix Computer Service</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(120deg,#0f2027,#203a43,#2c5364);
}
header{
  background:linear-gradient(to right,#0d6efd,#00b4d8);
  color:#fff;
  padding:20px;
  text-align:center;
}
.container{
  max-width:900px;
  margin:30px auto;
  background:#fff;
  border-radius:12px;
  padding:20px;
}
.tabs button{
  padding:8px 16px;
  margin-right:5px;
  border:none;
  border-radius:20px;
  cursor:pointer;
}
.active{background:#0d6efd;color:#fff;}
input,textarea,select{
  width:100%;
  padding:10px;
  margin:6px 0;
}
button.submit{
  background:#0d6efd;
  color:#fff;
  border:none;
  padding:10px;
  border-radius:20px;
  cursor:pointer;
}
.card{
  border:1px solid #ddd;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
}
.status{
  padding:4px 10px;
  border-radius:12px;
  color:#fff;
}
.Pending{background:#ffc107;color:#000;}
.Completed{background:#28a745;}
.Cancelled{background:#dc3545;}
.Received{background:#0dcaf0;}
.hide{display:none;}
</style>
</head>

<body>

<header>
<h1>💻 SmartFix Computer Service</h1>
<p>Fast • Trusted • Affordable Repair</p>
</header>

<div class="container">

<div class="tabs">
<button id="tabReg" class="active">Register</button>
<button id="tabLog">Login</button>
<button id="tabBook">Booking</button>
</div>

<!-- REGISTER -->
<div id="register">
<input id="rName" placeholder="Full Name">
<input id="rEmail" placeholder="Email">
<input id="rPass" type="password" placeholder="Password">
<button class="submit" onclick="register()">Register</button>
<p id="rMsg"></p>
</div>

<!-- LOGIN -->
<div id="login" class="hide">
<input id="lEmail" placeholder="Email">
<input id="lPass" type="password" placeholder="Password">
<button class="submit" onclick="login()">Login</button>
<p id="lMsg"></p>
</div>

<!-- BOOKING -->
<div id="booking" class="hide">
<input id="bName" placeholder="Name">
<input id="bPhone" placeholder="Phone">
<input id="bAddress" placeholder="Address">
<select id="bService">
<option>PC Repair</option>
<option>Laptop Repair</option>
<option>Windows Install</option>
<option>Printer</option>
</select>
<textarea id="bProblem" placeholder="Problem details"></textarea>
<input type="date" id="bDate">
<input type="time" id="bTime">
<button class="submit" onclick="book()">Submit Booking</button>
<p id="bMsg"></p>

<hr>
<h3>🔔 Your Booking Status</h3>
<div id="dashboard">Login to see updates</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, where, getDocs } 
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
  storageBucket: "smartfix-computer-service.appspot.com",
  messagingSenderId: "393720657887",
  appId: "1:393720657887:web:4501c751f97fd75122766a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const reg=document.getElementById("register");
const log=document.getElementById("login");
const bookDiv=document.getElementById("booking");

tabReg.onclick=()=>show("register");
tabLog.onclick=()=>show("login");
tabBook.onclick=()=>show("booking");

function show(id){
  reg.classList.add("hide");
  log.classList.add("hide");
  bookDiv.classList.add("hide");
  document.getElementById(id).classList.remove("hide");
}

window.register=async()=>{
  try{
    await createUserWithEmailAndPassword(auth,rEmail.value,rPass.value);
    rMsg.innerText="Registered!";
    show("login");
  }catch(e){rMsg.innerText=e.message;}
}

window.login=async()=>{
  try{
    await signInWithEmailAndPassword(auth,lEmail.value,lPass.value);
    lMsg.innerText="Logged in!";
    show("booking");
  }catch(e){lMsg.innerText=e.message;}
}

window.book=async()=>{
  await addDoc(collection(db,"bookings"),{
    userEmail:auth.currentUser.email,
    name:bName.value,
    phone:bPhone.value,
    address:bAddress.value,
    service:bService.value,
    problem:bProblem.value,
    date:bDate.value,
    time:bTime.value,
    status:"Pending"
  });
  bMsg.innerText="Booking submitted!";
  loadDashboard();
}

async function loadDashboard(){
  const dash=document.getElementById("dashboard");
  dash.innerHTML="Loading...";
  const q=query(collection(db,"bookings"),where("userEmail","==",auth.currentUser.email));
  const snap=await getDocs(q);
  dash.innerHTML="";
  snap.forEach(d=>{
    const b=d.data();
    dash.innerHTML+=`
    <div class="card">
    <b>${b.service}</b><br>
    ${b.date} ${b.time}<br>
    <span class="status ${b.status}">${b.status}</span>
    ${b.status==="Cancelled"?`<p>Reason: ${b.cancelReason}</p>`:""}
    </div>`;
  });
}

onAuthStateChanged(auth,user=>{
  if(user){
    show("booking");
    loadDashboard();
  }
});
</script>

</body>
</html>
