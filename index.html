<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SmartFix Computer Service</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #333;
    }

    header {
      background: linear-gradient(90deg, #0a58ca, #00b4d8);
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px;
    }

    .tabs button {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .tabs button.active {
      background: #0a58ca;
      color: white;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h2 {
      margin-top: 0;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button.submit {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 25px;
      background: linear-gradient(90deg, #0a58ca, #00b4d8);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .msg {
      margin-top: 10px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: white;
      margin: 20px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  <h1>💻 SmartFix Computer Service</h1>
  <p>Fast • Trusted • Affordable Repair & Support</p>
</header>

<div class="tabs">
  <button id="tabRegister" class="active">Register</button>
  <button id="tabLogin">Login</button>
  <button id="tabBooking">Booking</button>
</div>

<div class="container">

  <!-- Register -->
  <div id="register">
    <h2>Create Account</h2>
    <input id="regName" placeholder="Full Name" />
    <input id="regPhone" placeholder="Phone Number" />
    <input id="regEmail" placeholder="Email Address" />
    <input id="regPassword" type="password" placeholder="Password" />
    <button class="submit" onclick="register()">Register</button>
    <div class="msg" id="regMsg"></div>
  </div>

  <!-- Login -->
  <div id="login" class="hidden">
    <h2>Login</h2>
    <input id="loginEmail" placeholder="Email Address" />
    <input id="loginPassword" type="password" placeholder="Password" />
    <button class="submit" onclick="login()">Login</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- Booking -->
  <div id="booking" class="hidden">
    <h2>Book a Service</h2>
    <input id="bName" placeholder="Your Name" />
    <input id="bPhone" placeholder="Phone Number" />
    <input id="bAddress" placeholder="Address" />
    <select id="bService">
      <option value="">Select Service</option>
      <option>PC Repair</option>
      <option>Laptop Repair</option>
      <option>Windows Install</option>
      <option>Printer Repair</option>
    </select>
    <textarea id="bProblem" placeholder="Problem Details"></textarea>
    <input id="bDate" type="date" />
    <input id="bTime" type="time" />
    <button class="submit" onclick="book()">Submit Booking</button>
    <div class="msg" id="bookMsg"></div>
  </div>

</div>

<footer>
  © 2026 SmartFix Computer Service • Powered by GitHub Pages + Firebase
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
    from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, serverTimestamp } 
    from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
    authDomain: "smartfix-computer-service.firebaseapp.com",
    projectId: "smartfix-computer-service",
    storageBucket: "smartfix-computer-service.appspot.com",
    messagingSenderId: "393720657887",
    appId: "1:393720657887:web:4501c751f97fd75122766a"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Tabs
  const show = (id) => {
    ["register","login","booking"].forEach(x =>
      document.getElementById(x).classList.add("hidden")
    );
    document.getElementById(id).classList.remove("hidden");

    document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
    document.getElementById("tab" + id.charAt(0).toUpperCase() + id.slice(1)).classList.add("active");
  };

  document.getElementById("tabRegister").onclick = () => show("register");
  document.getElementById("tabLogin").onclick = () => show("login");
  document.getElementById("tabBooking").onclick = () => show("booking");

  // Register
  window.register = async () => {
    try {
      await createUserWithEmailAndPassword(
        auth,
        regEmail.value,
        regPassword.value
      );
      regMsg.textContent = "✅ Registration successful!";
    } catch (e) {
      regMsg.textContent = "❌ " + e.message;
    }
  };

  // Login
  window.login = async () => {
    try {
      await signInWithEmailAndPassword(
        auth,
        loginEmail.value,
        loginPassword.value
      );
      loginMsg.textContent = "✅ Login successful!";
    } catch (e) {
      loginMsg.textContent = "❌ " + e.message;
    }
  };

  // Booking
  window.book = async () => {
    try {
      await addDoc(collection(db, "bookings"), {
        name: bName.value,
        phone: bPhone.value,
        address: bAddress.value,
        service: bService.value,
        problem: bProblem.value,
        date: bDate.value,
        time: bTime.value,
        createdAt: serverTimestamp()
      });
      bookMsg.textContent = "✅ Booking submitted!";
    } catch (e) {
      bookMsg.textContent = "❌ " + e.message;
    }
  };
</script>

</body>
</html>
