<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartFix Admin Dashboard</title>
  <style>
    :root{
      --bg1:#071a2b;
      --bg2:#0b2a3f;
      --card:#ffffff;
      --text:#0d1721;
      --muted:#6b7280;
      --brand:#1e88ff;
      --brand2:#00c2ff;
      --shadow: 0 20px 60px rgba(0,0,0,.25);
      --radius:18px;
    }
    *{box-sizing:border-box;font-family:system-ui,Segoe UI,Arial;}
    body{
      margin:0;
      min-height:100vh;
      background: radial-gradient(1200px 600px at 20% 10%, #143a66 0%, transparent 60%),
                  radial-gradient(900px 500px at 80% 20%, #0a6aa6 0%, transparent 55%),
                  linear-gradient(180deg, var(--bg1), #030b14 70%);
      padding:22px;
      color:#fff;
    }
    .wrap{max-width:1100px;margin:0 auto;}
    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      background: rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      padding:16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }
    .topbar h1{margin:0;font-size:20px}
    .topbar p{margin:4px 0 0;color:rgba(255,255,255,.75);font-size:12px}
    .btn{
      border:none;cursor:pointer;
      padding:10px 14px;border-radius: 14px;
      font-weight:800;
      color:white;
      background: linear-gradient(90deg, var(--brand), var(--brand2));
    }
    .card{
      margin-top:16px;
      background: rgba(255,255,255,.95);
      color:var(--text);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding:16px;
      overflow:auto;
    }
    table{
      width:100%;
      border-collapse:collapse;
      min-width:900px;
    }
    th, td{
      border-bottom:1px solid #e5e7eb;
      padding:10px 8px;
      text-align:left;
      font-size:13px;
      vertical-align:top;
    }
    th{font-size:12px;color:#334155;background:#f8fafc;position:sticky;top:0}
    .muted{color:var(--muted);font-size:12px}
    .status{
      display:inline-block;
      padding:5px 10px;
      border-radius:999px;
      font-size:12px;
      background:#eef2ff;
      color:#1e40af;
      border:1px solid #c7d2fe;
    }
    .footer{
      text-align:center;
      margin-top:14px;
      color:rgba(255,255,255,.7);
      font-size:12px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>📌 SmartFix Admin Dashboard</h1>
        <p>View all customer bookings (Firestore)</p>
      </div>
      <button class="btn" onclick="loadBookings()">🔄 Refresh</button>
    </div>

    <div class="card">
      <div class="muted" id="info">Loading bookings...</div>
      <table id="table" style="margin-top:10px; display:none;">
        <thead>
          <tr>
            <th>#</th>
            <th>Date/Time</th>
            <th>Service</th>
            <th>User Email</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Details</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="footer">© 2026 SmartFix Computer Service</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDL2OFxYzmXKUp5edh6QtD2f5gkb6oZAv4",
      authDomain: "smartfix-computer-service.firebaseapp.com",
      projectId: "smartfix-computer-service",
      storageBucket: "smartfix-computer-service.firebasestorage.app",
      messagingSenderId: "393720657887",
      appId: "1:393720657887:web:4501c751f97fd75122766a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const info = document.getElementById("info");
    const table = document.getElementById("table");
    const tbody = document.getElementById("tbody");

    window.loadBookings = async () => {
      info.textContent = "Loading bookings...";
      table.style.display = "none";
      tbody.innerHTML = "";

      try{
        const q = query(collection(db, "bookings"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);

        let i = 1;
        snap.forEach(doc => {
          const b = doc.data();
          const tr = document.createElement("tr");

          tr.innerHTML = `
            <td>${i++}</td>
            <td>${(b.date || "")} ${(b.time || "")}</td>
            <td>${b.service || ""}</td>
            <td>${b.userEmail || ""}</td>
            <td>${b.phone || ""}</td>
            <td>${b.address || ""}</td>
            <td>${b.details || ""}</td>
            <td><span class="status">${b.status || "Pending"}</span></td>
          `;
          tbody.appendChild(tr);
        });

        info.textContent = `Total bookings: ${snap.size}`;
        table.style.display = "table";
      }catch(e){
        info.textContent = "Error: " + e.message;
      }
    };

    loadBookings();
  </script>
</body>
</html>
