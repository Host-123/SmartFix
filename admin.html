<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(120deg,#0f2027,#203a43,#2c5364);
  color:#fff;
}

/* HEADER */
header{
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(12px);
  padding:20px;
  text-align:center;
  position:relative;
}
.logout{
  position:absolute;
  right:20px;
  top:20px;
  background:#dc3545;
}

/* CONTAINER */
.container{
  max-width:1200px;
  margin:30px auto;
  padding:20px;
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(15px);
  border-radius:16px;
  border:1px solid rgba(255,255,255,.3);
}

/* SUMMARY */
.summary{
  display:flex;
  gap:15px;
  margin-bottom:15px;
}
.card{
  flex:1;
  padding:15px;
  text-align:center;
  border-radius:12px;
  background:rgba(255,255,255,.18);
}
.card h2{margin:0;font-size:26px;}
.card p{margin:5px 0 0;opacity:.8;}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  padding:10px;
  border:1px solid rgba(255,255,255,.25);
  text-align:center;
}
th{
  background:rgba(255,255,255,.25);
}

button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  color:#fff;
}
.done{background:#28a745;}
.delete{background:#dc3545;}
</style>
</head>

<body>

<header>
  <h1>📌 SmartFix Admin Dashboard</h1>
  <p>Real-time booking management</p>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- SUMMARY CARDS -->
  <div class="summary">
    <div class="card">
      <h2 id="total">0</h2>
      <p>Total Bookings</p>
    </div>
    <div class="card">
      <h2 id="pending">0</h2>
      <p>Pending</p>
    </div>
    <div class="card">
      <h2 id="completed">0</h2>
      <p>Completed</p>
    </div>
  </div>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Service</th>
        <th>Date</th>
        <th>Time</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import {
  getFirestore, collection, onSnapshot,
  updateDoc, deleteDoc, doc
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ADMIN GUARD */
const ADMINS = ["student.student.on@gmail.com"];
onAuthStateChanged(auth,user=>{
  if(!user || !ADMINS.includes(user.email)){
    location.href="admin-login.html";
  }
});

/* LOGOUT */
window.logout = ()=>{
  signOut(auth).then(()=>location.href="admin-login.html");
};

/* REALTIME BOOKINGS */
const tbody = document.getElementById("tbody");
const totalEl = document.getElementById("total");
const pendingEl = document.getElementById("pending");
const completedEl = document.getElementById("completed");

onSnapshot(collection(db,"bookings"), snap=>{
  tbody.innerHTML="";
  let i=1, pending=0, completed=0;

  snap.forEach(d=>{
    const b=d.data();
    if(b.status==="Completed") completed++;
    else pending++;

    tbody.innerHTML+=`
      <tr>
        <td>${i++}</td>
        <td>${b.name}</td>
        <td>${b.phone}</td>
        <td>${b.service}</td>
        <td>${b.date}</td>
        <td>${b.time}</td>
        <td>${b.status}</td>
        <td>
          <button class="done" onclick="markDone('${d.id}')">✔</button>
          <button class="delete" onclick="removeBooking('${d.id}')">🗑️</button>
        </td>
      </tr>
    `;
  });

  totalEl.textContent = snap.size;
  pendingEl.textContent = pending;
  completedEl.textContent = completed;
});

/* ACTIONS */
window.markDone = async(id)=>{
  await updateDoc(doc(db,"bookings",id),{status:"Completed"});
};

window.removeBooking = async(id)=>{
  if(confirm("Delete this booking?")){
    await deleteDoc(doc(db,"bookings",id));
  }
};
</script>

</body>
</html>
