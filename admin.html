<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(120deg,#0f2027,#203a43,#2c5364);
  color:#fff;
}

/* HEADER */
header{
  padding:20px;
  text-align:center;
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(12px);
  position:relative;
}
.logout{
  position:absolute;
  right:20px;
  top:20px;
  background:#dc3545;
}

/* CONTAINER */
.container{
  max-width:1200px;
  margin:30px auto;
  padding:20px;
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(15px);
  border-radius:16px;
}

/* BUTTONS */
button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  color:#fff;
}
.refresh{background:#6c757d;margin-bottom:10px;}
.done{background:#28a745;}
.delete{background:#dc3545;}
.view{background:#0d6efd;}

/* SUMMARY */
.summary{
  display:flex;
  gap:15px;
  margin-bottom:15px;
}
.card{
  flex:1;
  text-align:center;
  padding:15px;
  border-radius:12px;
  background:rgba(255,255,255,.18);
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:10px;
  border:1px solid rgba(255,255,255,.25);
  text-align:center;
}
th{background:rgba(255,255,255,.25);}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  justify-content:center;
  align-items:center;
}
.modal-content{
  background:#1f3b44;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:400px;
}
.close{background:#dc3545;width:100%;}
</style>
</head>

<body>

<header>
  <h1>📌 SmartFix Admin Dashboard</h1>
  <p>Real-time booking management</p>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

<button class="refresh" onclick="loadBookings()">🔄 Refresh</button>

<!-- SUMMARY -->
<div class="summary">
  <div class="card"><h2 id="total">0</h2><p>Total</p></div>
  <div class="card"><h2 id="pending">0</h2><p>Pending</p></div>
  <div class="card"><h2 id="completed">0</h2><p>Completed</p></div>
</div>

<table>
<thead>
<tr>
  <th>#</th><th>Name</th><th>Phone</th><th>Service</th>
  <th>Date</th><th>Time</th><th>Status</th><th>Action</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<!-- VIEW DETAILS MODAL -->
<div class="modal" id="modal">
  <div class="modal-content" id="modalContent"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import { getFirestore, collection, onSnapshot, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMINS=["student.student.on@gmail.com"];
onAuthStateChanged(auth,u=>{
  if(!u || !ADMINS.includes(u.email)) location.href="admin-login.html";
});

window.logout=()=>signOut(auth).then(()=>location.href="admin-login.html");

const tbody=document.getElementById("tbody");
const totalEl=document.getElementById("total");
const pendingEl=document.getElementById("pending");
const completedEl=document.getElementById("completed");

/* LOAD BOOKINGS */
window.loadBookings=()=>{
onSnapshot(collection(db,"bookings"),snap=>{
  tbody.innerHTML="";
  let i=1,p=0,c=0;

  snap.forEach(d=>{
    const b=d.data();
    b.status==="Completed"?c++:p++;

    tbody.innerHTML+=`
    <tr>
      <td>${i++}</td>
      <td>${b.name}</td>
      <td>${b.phone}</td>
      <td>${b.service}</td>
      <td>${b.date}</td>
      <td>${b.time}</td>
      <td>${b.status}</td>
      <td>
        <button class="view" onclick='view(${JSON.stringify(b)})'>👁</button>
        <button class="done" onclick="done('${d.id}')">✔</button>
        <button class="delete" onclick="del('${d.id}')">🗑</button>
      </td>
    </tr>`;
  });

  totalEl.textContent=snap.size;
  pendingEl.textContent=p;
  completedEl.textContent=c;
});
};

/* ACTIONS */
window.done=id=>updateDoc(doc(db,"bookings",id),{status:"Completed"});
window.del=id=>confirm("Delete?")&&deleteDoc(doc(db,"bookings",id));

/* VIEW DETAILS */
window.view=b=>{
  modal.style.display="flex";
  modalContent.innerHTML=`
    <h3>📄 Booking Details</h3>
    <p><b>Name:</b> ${b.name}</p>
    <p><b>Phone:</b> ${b.phone}</p>
    <p><b>Address:</b> ${b.address}</p>
    <p><b>Service:</b> ${b.service}</p>
    <p><b>Problem:</b> ${b.problem}</p>
    <p><b>Date:</b> ${b.date}</p>
    <p><b>Time:</b> ${b.time}</p>
    <p><b>Status:</b> ${b.status}</p>
    <button class="close" onclick="modal.style.display='none'">Close</button>`;
};

loadBookings();
</script>

</body>
</html>
