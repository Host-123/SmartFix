<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(120deg,#0f2027,#203a43,#2c5364);
  margin:0;
}
header{
  background: linear-gradient(to right,#0d6efd,#00b4d8);
  color:#fff;
  padding:20px;
  text-align:center;
}
.container{
  max-width:1200px;
  margin:30px auto;
  background:#fff;
  border-radius:12px;
  padding:20px;
}
button{
  padding:6px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.edit{background:#0d6efd;color:#fff;}
.done{background:#28a745;color:#fff;}
.logout{background:#dc3545;color:#fff;float:right}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:10px;
  border:1px solid #ddd;
  text-align:center;
}
.status{
  padding:4px 10px;
  border-radius:20px;
  font-size:13px;
}
.pending{background:#ffc107;}
.completed{background:#28a745;color:#fff;}
</style>
</head>

<body>

<header>
  <h1>📌 SmartFix Admin Dashboard</h1>
  <p>All customer bookings appear here</p>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">
  <button onclick="loadBookings()">🔄 Refresh</button>
  <p id="info"></p>

  <table id="table" style="display:none;">
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Service</th>
        <th>Problem</th>
        <th>Date</th>
        <th>Time</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { 
  getAuth, onAuthStateChanged, signOut 
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import { 
  getFirestore, collection, getDocs, updateDoc, doc 
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ✅ ADMIN LIST */
const ADMINS = ["student.student.on@gmail.com"];

/* 🔐 SECURITY CHECK */
onAuthStateChanged(auth,(user)=>{
  if(!user || !ADMINS.includes(user.email)){
    location.href="admin-login.html";
  }
});

/* LOGOUT */
window.logout = ()=>{
  signOut(auth).then(()=>{
    location.href="admin-login.html";
  });
};

/* LOAD BOOKINGS */
window.loadBookings = async ()=>{
  const tbody = document.getElementById("tbody");
  const info = document.getElementById("info");
  tbody.innerHTML = "";

  const snap = await getDocs(collection(db,"bookings"));
  if(snap.empty){
    info.textContent="❌ No bookings found";
    return;
  }

  let i=1;
  snap.forEach(d=>{
    const b=d.data();
    tbody.innerHTML+=`
      <tr>
        <td>${i++}</td>
        <td contenteditable>${b.name}</td>
        <td contenteditable>${b.phone}</td>
        <td contenteditable>${b.address}</td>
        <td contenteditable>${b.service}</td>
        <td contenteditable>${b.problem}</td>
        <td contenteditable>${b.date}</td>
        <td contenteditable>${b.time}</td>
        <td>
          <span class="status ${b.status==="Completed"?"completed":"pending"}">
            ${b.status}
          </span>
        </td>
        <td>
          <button class="edit" onclick="saveEdit('${d.id}',this)">Save</button>
          <button class="done" onclick="markDone('${d.id}')">Completed</button>
        </td>
      </tr>`;
  });

  info.textContent=`✅ Total bookings: ${snap.size}`;
  document.getElementById("table").style.display="table";
};

window.saveEdit = async (id,btn)=>{
  const td = btn.parentElement.parentElement.children;
  await updateDoc(doc(db,"bookings",id),{
    name: td[1].innerText,
    phone: td[2].innerText,
    address: td[3].innerText,
    service: td[4].innerText,
    problem: td[5].innerText,
    date: td[6].innerText,
    time: td[7].innerText
  });
  alert("✏️ Updated");
};

window.markDone = async (id)=>{
  await updateDoc(doc(db,"bookings",id),{status:"Completed"});
  loadBookings();
};

loadBookings();
</script>

</body>
</html>
