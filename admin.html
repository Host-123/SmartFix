<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartFix Admin Dashboard</title>
  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg,#061a2b,#0b3b57,#061a2b);
      color:#111;
      padding:20px;
    }
    .wrap{
      max-width:1100px;
      margin:auto;
      background:#fff;
      border-radius:20px;
      padding:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.3);
    }
    h1{
      margin:0 0 10px;
      color:#0d47a1;
    }
    p{margin:0 0 15px; color:#333;}
    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
      display:none;
    }
    th, td{
      padding:10px;
      border:1px solid #ddd;
      text-align:left;
      font-size:14px;
    }
    th{
      background:#0d47a1;
      color:white;
    }
    .status{
      font-weight:bold;
      padding:4px 10px;
      border-radius:10px;
      background:#ffcc80;
    }
    .info{
      margin-top:10px;
      font-weight:bold;
      color:#444;
    }
    .btn{
      padding:10px 15px;
      border:none;
      border-radius:10px;
      background:linear-gradient(90deg,#0d47a1,#00acc1);
      color:white;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📌 SmartFix Admin Dashboard</h1>
    <p>All customer bookings will appear here.</p>

    <button class="btn" onclick="loadBookings()">🔄 Refresh Bookings</button>
    <div class="info" id="info"></div>

    <table id="table">
      <thead>
        <tr>
          <th>#</th>
          <th>Date</th>
          <th>Time</th>
          <th>Service</th>
          <th>User Email</th>
          <th>Phone</th>
          <th>Address</th>
          <th>Details</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } 
      from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDL2OFxYzmXKUp5edh6QtD2f5gkb6oZAv4",
      authDomain: "smartfix-computer-service.firebaseapp.com",
      projectId: "smartfix-computer-service",
      storageBucket: "smartfix-computer-service.firebasestorage.app",
      messagingSenderId: "393720657887",
      appId: "1:393720657887:web:4501c751f97fd75122766a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.loadBookings = async function(){
      const tbody = document.getElementById("tbody");
      const info = document.getElementById("info");
      const table = document.getElementById("table");

      tbody.innerHTML = "";
      info.textContent = "Loading bookings...";

      try{
        const q = query(collection(db,"bookings"), orderBy("createdAt","desc"));
        const snap = await getDocs(q);

        if(snap.empty){
          info.textContent = "No bookings found!";
          table.style.display="none";
          return;
        }

        let i=0;
        snap.forEach((doc)=>{
          i++;
          const b = doc.data();

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${i}</td>
            <td>${b.date || ""}</td>
            <td>${b.time || ""}</td>
            <td>${b.service || ""}</td>
            <td>${b.userEmail || ""}</td>
            <td>${b.phone || ""}</td>
            <td>${b.address || ""}</td>
            <td>${b.details || ""}</td>
            <td><span class="status">${b.status || "Pending"}</span></td>
          `;
          tbody.appendChild(tr);
        });

        info.textContent = `Total bookings: ${snap.size}`;
        table.style.display="table";
      }catch(e){
        info.textContent = "Error: " + e.message;
      }
    }

    loadBookings();
  </script>
</body>
</html>
