<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix Computer Service – Booking</title>

<style>
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  margin:0;
  padding:40px;
}
.card{
  background:#fff;
  max-width:520px;
  margin:auto;
  padding:25px;
  border-radius:10px;
}
h2,h3{margin-top:0}
input,select,textarea,button{
  width:100%;
  padding:10px;
  margin:8px 0;
  font-size:15px;
}
button{
  background:#0a74ff;
  color:#fff;
  border:none;
  cursor:pointer;
}
button:hover{opacity:.9}
#msg{
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
<h2>🔧 New Booking</h2>

<form id="bookingForm">
<input id="name" placeholder="Full Name" required>
<input id="phone" placeholder="Phone Number" required>
<input id="address" placeholder="Address" required>

<select id="service" required>
  <option value="">Select Service</option>
  <option>PC Repair</option>
  <option>Laptop Repair</option>
  <option>Windows Install</option>
  <option>Printer Service</option>
  <option>Software Install</option>
</select>

<textarea id="problem" placeholder="Problem details"></textarea>
<input type="date" id="date" required>
<input type="time" id="time" required>

<button type="submit">Submit Booking</button>
</form>

<div id="msg"></div>

<hr>
<h3>📌 Your Booking Status</h3>
<div id="statusBox">Enter phone number to see status</div>
</div>

<!-- ================= FIREBASE ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { 
  getFirestore, 
  collection, 
  addDoc, 
  serverTimestamp,
  onSnapshot,
  query,
  where
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* Firebase config */
const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const phoneInput = document.getElementById("phone");
const statusBox = document.getElementById("statusBox");

/* SUBMIT BOOKING */
document.getElementById("bookingForm").addEventListener("submit", async (e)=>{
  e.preventDefault();

  const data = {
  name: document.getElementById("name").value || "",
  phone: document.getElementById("phone").value || "",
  address: document.getElementById("address").value || "",
  service: document.getElementById("service").value || "",
  problem: document.getElementById("problem").value || "",
  date: document.getElementById("date").value || "",
  time: document.getElementById("time").value || "",
  status: "Pending",
  createdAt: serverTimestamp()
};


  try{
    await addDoc(collection(db,"bookings"), data);
    msg.innerHTML = "✅ Booking successful!";
    loadStatus(phone.value);
    e.target.reset();
  }catch(err){
    msg.innerHTML = "❌ " + err.message;
  }
});

/* LIVE STATUS */
function loadStatus(phone){
  if(!phone) return;

  const q = query(collection(db,"bookings"), where("phone","==",phone));

  onSnapshot(q, snap=>{
    if(snap.empty){
      statusBox.innerHTML = "❌ No booking found";
      return;
    }

    let html = "";
    snap.forEach(doc=>{
      const b = doc.data();
      html += `
      <div style="border:1px solid #ccc;padding:10px;margin-bottom:8px;border-radius:6px">
        <b>Service:</b> ${b.service}<br>
        <b>Date:</b> ${b.date} ${b.time}<br>
        <b>Status:</b>
        <span style="
          padding:4px 10px;
          border-radius:20px;
          color:white;
          background:${b.status==="Completed"?"green":b.status==="Cancelled"?"red":"orange"};
        ">
          ${b.status}
        </span>
      </div>`;
    });
    statusBox.innerHTML = html;
  });
}

phoneInput.addEventListener("change",()=>{
  loadStatus(phoneInput.value.trim());
});
</script>

</body>
</html>
