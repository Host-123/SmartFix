<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix – Book Service</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;}

body{
  margin:0;
  min-height:100vh;
  padding:40px 15px;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
}

.card{
  max-width:520px;
  margin:auto;
  padding:25px;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(15px);
  border-radius:16px;
  border:1px solid rgba(255,255,255,.3);
}

h2,h3{text-align:center;margin-top:0;}

input,select,textarea,button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.45);
  background:rgba(255,255,255,.28);
  color:#fff;
}

input::placeholder,textarea::placeholder{
  color:#f1f5f9;
  opacity:1;
}

select option{color:#000;}

button{
  background:#0d6efd;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
button:hover{opacity:.9;}

.logout{
  background:#dc3545;
  margin-bottom:10px;
}

.refresh{
  background:#6c757d;
}

.status-card{
  margin-top:8px;
  padding:10px;
  border-radius:10px;
  background:rgba(255,255,255,.15);
}

.badge{
  padding:4px 12px;
  border-radius:20px;
  font-size:13px;
  color:#fff;
}

.summary{
  display:flex;
  gap:10px;
  margin:10px 0;
}
.summary div{
  flex:1;
  text-align:center;
  padding:8px;
  border-radius:10px;
  background:rgba(255,255,255,.15);
}
</style>
</head>

<body>

<div class="card">

  <!-- LOGOUT -->
  <button class="logout" onclick="logout()">Logout</button>

  <h2>🔧 Book a Service</h2>

  <form id="bookingForm">
    <input id="name" placeholder="Full Name" required>
    <input id="phone" placeholder="Phone Number" required>
    <input id="address" placeholder="Address" required>

    <select id="service" required>
      <option value="">Select Service</option>
      <option>PC Repair</option>
      <option>Laptop Repair</option>
      <option>Windows Install</option>
      <option>Software Install</option>
    </select>

    <textarea id="problem" rows="3" placeholder="Problem details (optional)"></textarea>
    <input type="date" id="date" required>
    <input type="time" id="time" required>

    <button type="submit">Submit Booking</button>
  </form>

  <p id="msg"></p>

  <h3>📌 Your Booking Status</h3>

  <!-- SUMMARY -->
  <div class="summary">
    <div>Total: <b id="total">0</b></div>
    <div>Pending: <b id="pending">0</b></div>
    <div>Completed: <b id="completed">0</b></div>
  </div>

  <button class="refresh" onclick="refreshStatus()">🔄 Refresh Status</button>

  <div id="statusBox">Enter phone number to see status</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { 
  getAuth, onAuthStateChanged, signOut 
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, serverTimestamp,
  query, where, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🔐 LOGIN GUARD */
onAuthStateChanged(auth,user=>{
  if(!user){
    alert("Please login first");
    location.href="index.html";
  }
});

const phoneInput = document.getElementById("phone");
const statusBox = document.getElementById("statusBox");
const totalEl = document.getElementById("total");
const pendingEl = document.getElementById("pending");
const completedEl = document.getElementById("completed");
const msg = document.getElementById("msg");

/* SUBMIT BOOKING */
bookingForm.addEventListener("submit", async e=>{
  e.preventDefault();

  try{
    await addDoc(collection(db,"bookings"),{
      name: name.value,
      phone: phone.value,
      address: address.value,
      service: service.value,
      problem: problem.value,
      date: date.value,
      time: time.value,
      status:"Pending",
      createdAt: serverTimestamp()
    });

    msg.textContent="✅ Booking successful!";
    refreshStatus();
    bookingForm.reset();

  }catch(err){
    msg.textContent="❌ Booking failed: "+err.message;
  }
});

/* LOAD STATUS */
function loadStatus(phone){
  if(!phone) return;

  const q = query(collection(db,"bookings"), where("phone","==",phone));

  onSnapshot(q,snap=>{
    let total=0,pending=0,completed=0;
    statusBox.innerHTML="";

    snap.forEach(d=>{
      total++;
      const b=d.data();
      if(b.status==="Completed") completed++;
      else pending++;

      const color=b.status==="Completed"?"green":"orange";
      statusBox.innerHTML+=`
        <div class="status-card">
          <b>${b.service}</b><br>
          ${b.date} ${b.time}<br>
          <span class="badge" style="background:${color}">
            ${b.status}
          </span>
        </div>`;
    });

    totalEl.textContent=total;
    pendingEl.textContent=pending;
    completedEl.textContent=completed;
  });
}

/* REFRESH */
window.refreshStatus = ()=>{
  loadStatus(phoneInput.value.trim());
};

/* LOGOUT */
window.logout = ()=>{
  signOut(auth).then(()=>{
    location.href="index.html";
  });
};
</script>

</body>
</html>
