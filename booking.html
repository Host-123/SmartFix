<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix – Booking</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;}
body{
  margin:0;
  min-height:100vh;
  padding:40px 15px;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
}
.card{
  max-width:520px;
  margin:auto;
  padding:25px;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(15px);
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.3);
}
input,select,textarea,button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.4);
  background:rgba(255,255,255,0.25);
  color:#fff;
}
select option{color:#000;}
button{
  background:#0d6efd;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
#msg{text-align:center;font-weight:bold;}
.status-card{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:rgba(255,255,255,0.15);
}
.badge{
  padding:4px 12px;
  border-radius:20px;
  color:#fff;
}
</style>
</head>

<body>

<div class="card">
  <h2>🔧 New Booking</h2>

  <form id="bookingForm">
    <input id="name" placeholder="Full Name" required>
    <input id="phone" placeholder="Phone Number" required>
    <input id="address" placeholder="Address" required>

    <select id="service" required>
      <option value="">Select Service</option>
      <option>PC Repair</option>
      <option>Laptop Repair</option>
      <option>Windows Install</option>
      <option>Software Install</option>
    </select>

    <textarea id="problem" placeholder="Problem details"></textarea>
    <input type="date" id="date" required>
    <input type="time" id="time" required>

    <button type="submit">Submit Booking</button>
  </form>

  <div id="msg"></div>
  <h3>📌 Your Booking Status</h3>
  <div id="statusBox"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("bookingForm");
const msg = document.getElementById("msg");
const statusBox = document.getElementById("statusBox");

form.addEventListener("submit", async e=>{
  e.preventDefault();

  const phone = document.getElementById("phone").value.trim();

  await addDoc(collection(db,"bookings"),{
    name: name.value,
    phone,
    address: address.value,
    service: service.value,
    problem: problem.value,
    date: date.value,
    time: time.value,
    status:"Pending",
    createdAt: serverTimestamp()
  });

  msg.textContent="✅ Booking successful!";
  loadHistory(phone);
  form.reset();
});

function loadHistory(phone){
  const q = query(collection(db,"bookings"), where("phone","==",phone));
  onSnapshot(q,snap=>{
    statusBox.innerHTML="";
    snap.forEach(d=>{
      const b=d.data();
      const color=b.status==="Completed"?"green":"orange";
      statusBox.innerHTML+=`
        <div class="status-card">
          <b>${b.service}</b><br>
          ${b.date} ${b.time}<br>
          <span class="badge" style="background:${color}">${b.status}</span>
        </div>`;
    });
  });
}
</script>

</body>
</html>
