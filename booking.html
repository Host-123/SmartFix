<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix Computer Service – Booking</title>

<style>
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  margin:0;
  padding:40px;
}
.card{
  background:#fff;
  max-width:520px;
  margin:auto;
  padding:25px;
  border-radius:10px;
}
h2{margin-top:0}
input,select,textarea,button{
  width:100%;
  padding:10px;
  margin:8px 0;
  font-size:15px;
}
button{
  background:#0a74ff;
  color:#fff;
  border:none;
  cursor:pointer;
}
button:hover{opacity:.9}
#msg{
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
<h2>🔧 New Booking</h2>

<form id="bookingForm">

<input id="name" placeholder="Full Name" required>
<input id="phone" placeholder="Phone Number" required>
<input id="address" placeholder="Address" required>

<select id="service" required>
  <option value="">Select Service</option>
  <option>PC Repair</option>
  <option>Laptop Repair</option>
  <option>Windows Install</option>
  <option>Printer Service</option>
  <option>Software Install</option>
</select>

<textarea id="problem" placeholder="Problem details"></textarea>

<input type="date" id="date" required>
<input type="time" id="time" required>

<button type="submit">Submit Booking</button>
</form>

<div id="msg"></div>
</div>

<!-- ================= FIREBASE ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp }
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("bookingForm");
const msg  = document.getElementById("msg");

form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  msg.innerHTML = "⏳ Saving booking...";

  try{
    await addDoc(collection(db,"bookings"),{
      name: name.value,
      phone: phone.value,
      address: address.value,
      service: service.value,
      problem: problem.value,
      date: date.value,
      time: time.value,
      status: "Pending",
      createdAt: serverTimestamp()
    });

    msg.innerHTML = "✅ Booking submitted successfully!";
    form.reset();

  }catch(err){
    msg.innerHTML = "❌ " + err.message;
    console.error(err);
  }
});
</script>

</body>
</html>
