<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix – Book Service</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;}

body{
  margin:0;
  min-height:100vh;
  padding:40px 15px;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
}

.card{
  max-width:520px;
  margin:auto;
  padding:25px;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(15px);
  border-radius:16px;
  border:1px solid rgba(255,255,255,.3);
}

h2,h3{
  text-align:center;
  margin-top:0;
}

/* ===== INPUTS ===== */
input,select,textarea,button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.45);
  background:rgba(255,255,255,.28);
  color:#ffffff;
  font-size:15px;
}

input::placeholder,
textarea::placeholder{
  color:#f1f5f9;
  opacity:1;
  font-weight:500;
}

select{color:#fff;}
select option{color:#000;}

input:focus,
textarea:focus,
select:focus{
  outline:none;
  box-shadow:0 0 0 2px rgba(13,110,253,.6);
}

input[type="date"],
input[type="time"]{
  color-scheme: dark;
}

textarea{resize:none;}

button{
  background:#0d6efd;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
button:hover{opacity:.9;}

.logout{
  background:#dc3545;
  margin-bottom:10px;
}

#msg{
  text-align:center;
  font-weight:bold;
  margin-top:10px;
}

.status-card{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:rgba(255,255,255,.15);
}

.badge{
  padding:4px 12px;
  border-radius:20px;
  color:#fff;
  font-size:13px;
}
</style>
</head>

<body>

<div class="card">

  <!-- LOGOUT -->
  <button class="logout" onclick="logout()">Logout</button>

  <h2>🔧 Book a Service</h2>

  <form id="bookingForm">
    <input id="name" placeholder="Full Name" required>
    <input id="phone" placeholder="Phone Number" required>
    <input id="address" placeholder="Address" required>

    <select id="service" required>
      <option value="">Select Service</option>
      <option>PC Repair</option>
      <option>Laptop Repair</option>
      <option>Windows Install</option>
      <option>Software Install</option>
    </select>

    <textarea id="problem" rows="3" placeholder="Problem details (optional)"></textarea>
    <input type="date" id="date" required>
    <input type="time" id="time" required>

    <button type="submit">Submit Booking</button>
  </form>

  <div id="msg"></div>

  <h3>📌 Your Booking Status</h3>
  <div id="statusBox">Enter phone number to see status</div>
</div>

<!-- ===== FIREBASE ===== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getAuth, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, serverTimestamp,
  query, where, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ===== AUTH GUARD ===== */
onAuthStateChanged(auth,user=>{
  if(!user){
    location.href="index.html";
  }
});

/* ===== ELEMENTS ===== */
const form = document.getElementById("bookingForm");
const msg = document.getElementById("msg");
const statusBox = document.getElementById("statusBox");

const nameInput = document.getElementById("name");
const phoneInput = document.getElementById("phone");
const addressInput = document.getElementById("address");
const serviceInput = document.getElementById("service");
const problemInput = document.getElementById("problem");
const dateInput = document.getElementById("date");
const timeInput = document.getElementById("time");

/* ===== SUBMIT BOOKING ===== */
form.addEventListener("submit", async e=>{
  e.preventDefault();

  try{
    await addDoc(collection(db,"bookings"),{
      name: nameInput.value,
      phone: phoneInput.value,
      address: addressInput.value,
      service: serviceInput.value,
      problem: problemInput.value,
      date: dateInput.value,
      time: timeInput.value,
      status: "Pending",
      createdAt: serverTimestamp()
    });

    msg.textContent="✅ Booking successful!";
    loadHistory(phoneInput.value);
    form.reset();
  }catch(err){
    msg.textContent="❌ " + err.message;
  }
});

/* ===== LOAD STATUS ===== */
function loadHistory(phone){
  if(!phone) return;

  const q = query(collection(db,"bookings"), where("phone","==",phone));
  onSnapshot(q,snap=>{
    if(snap.empty){
      statusBox.textContent="❌ No bookings found";
      return;
    }

    statusBox.innerHTML="";
    snap.forEach(d=>{
      const b=d.data();
      const color=b.status==="Completed"?"green":"orange";
      statusBox.innerHTML+=`
        <div class="status-card">
          <b>${b.service}</b><br>
          ${b.date} ${b.time}<br>
          <span class="badge" style="background:${color}">
            ${b.status}
          </span>
        </div>
      `;
    });
  });
}

/* ===== LOGOUT ===== */
window.logout = ()=>{
  signOut(auth).then(()=>{
    location.href="index.html";
  });
};
</script>

</body>
</html>
