<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix | Book Service</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;}

body{
  margin:0;
  min-height:100vh;
  padding:20px;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
}

/* LOGOUT */
.logout{
  background:#dc3545;
  color:#fff;
  padding:10px;
  border-radius:8px;
  border:none;
  width:100%;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:15px;
}

/* CARD */
.card{
  max-width:420px;
  margin:auto;
  padding:25px;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(15px);
  border-radius:16px;
  border:1px solid rgba(255,255,255,.3);
}

/* INPUTS */
input,select,textarea,button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}

input,select,textarea{
  background:rgba(255,255,255,.28);
  color:#fff;
}
input::placeholder,textarea::placeholder{
  color:#f1f5f9;
}

select option{color:#000;}
textarea{resize:none}

/* BUTTONS */
.submit{
  background:#0d6efd;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.refresh{
  background:#0d6efd;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.back{
  background:#198754;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  transform:scale(1.03);
}

/* STATUS */
.status-box{
  margin-top:15px;
}

.status-summary{
  display:flex;
  gap:8px;
  margin-bottom:8px;
}

.badge{
  flex:1;
  padding:8px;
  text-align:center;
  border-radius:8px;
  background:rgba(255,255,255,.2);
}

.status-card{
  background:rgba(255,255,255,.15);
  padding:10px;
  border-radius:10px;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="card">

<button class="logout" onclick="logout()">Logout</button>

<h2 style="text-align:center;">🔧 Book a Service</h2>

<form id="bookingForm">
  <input id="name" placeholder="Full Name" required>
  <input id="phone" placeholder="Phone Number" required>
  <input id="address" placeholder="Address" required>

  <select id="service" required>
    <option value="">Select Service</option>
    <option>PC Repair</option>
    <option>Laptop Repair</option>
    <option>Windows Install</option>
    <option>Software Install</option>
  </select>

  <textarea id="problem" rows="3" placeholder="Problem details (optional)"></textarea>
  <input type="date" id="date" required>
  <input type="time" id="time" required>

  <button class="submit" type="submit">Submit Booking</button>
</form>

<div id="msg"></div>

<h3 style="text-align:center;margin-top:20px;">📌 Your Booking Status</h3>

<div class="status-summary">
  <div class="badge">Total: <span id="total">0</span></div>
  <div class="badge">Pending: <span id="pending">0</span></div>
  <div class="badge">Completed: <span id="completed">0</span></div>
</div>

<!-- ✅ Instruction text (YOU ASKED THIS) -->
<p style="text-align:center;font-size:13px;opacity:.85;margin:10px 0;">
  Enter phone number to see status
</p>

<button class="refresh" onclick="refreshStatus()">🔄 Refresh Status Check</button>
<button class="back" onclick="backToBooking()">⬅ Back to Booking</button>

<div id="statusBox" class="status-box"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, serverTimestamp,
  query, where, getDocs
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("bookingForm");
const msg = document.getElementById("msg");
const statusBox = document.getElementById("statusBox");

/* LOGOUT */
window.logout = ()=>{
  signOut(auth).then(()=>location.href="index.html");
};

/* SUBMIT BOOKING */
form.addEventListener("submit", async e=>{
  e.preventDefault();

  try{
    await addDoc(collection(db,"bookings"),{
      name:name.value,
      phone:phone.value,
      address:address.value,
      service:service.value,
      problem:problem.value,
      date:date.value,
      time:time.value,
      status:"Pending",
      createdAt:serverTimestamp()
    });

    msg.textContent="✅ Booking successful!";
    form.reset();
    refreshStatus();
  }catch(err){
    msg.textContent="❌ "+err.message;
  }
});

/* LOAD STATUS */
window.refreshStatus = async ()=>{
  statusBox.innerHTML="";
  let total=0,pending=0,completed=0;

  const q = query(collection(db,"bookings"), where("phone","==",phone.value));
  const snap = await getDocs(q);

  snap.forEach(d=>{
    const b=d.data();
    total++;
    if(b.status==="Completed") completed++;
    else pending++;

    statusBox.innerHTML+=`
      <div class="status-card">
        <b>${b.service}</b><br>
        ${b.date} ${b.time}<br>
        Status: ${b.status}
      </div>
    `;
  });

  document.getElementById("total").innerText=total;
  document.getElementById("pending").innerText=pending;
  document.getElementById("completed").innerText=completed;
};

/* BACK TO BOOKING */
window.backToBooking = ()=>{
  window.scrollTo({top:0,behavior:"smooth"});
};
</script>

</body>
</html>
