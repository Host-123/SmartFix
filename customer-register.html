<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartFix | Create Account</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(120deg,#0f2027,#203a43,#2c5364);
}

.card{
  width:360px;
  padding:30px;
  text-align:center;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(15px);
  border-radius:16px;
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
}

input,button{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:none;
}

/* input background + text */
input{
  background:rgba(255,255,255,.25);
  color:#ffffff;
}

/* ✅ FIX placeholder visibility */
input::placeholder{
  color:#f1f5f9;
  opacity:1;
  font-weight:500;
}

/* focus effect */
input:focus{
  outline:none;
  box-shadow:0 0 0 2px rgba(13,110,253,0.6);
}

button{
  background:#0d6efd;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

a{
  color:#bcdcff;
  text-decoration:none;
  display:block;
  margin-top:10px;
}

#msg{
  margin-top:10px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">
  <h2>
    <span style="font-size:22px;">👤</span><br>
    Create Account
  </h2>
  <p style="font-size:13px;opacity:.8;margin-top:5px;">
    Smartfix Computer Service
  </p>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password (min 6 characters)">

  <button onclick="register()">Create Account</button>

  <a href="index.html">Back to Login</a>
  <div id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDL2OFxYzmxKUp5edh6QtD2f5gkb6oZAv4",
  authDomain: "smartfix-computer-service.firebaseapp.com",
  projectId: "smartfix-computer-service",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.register = ()=>{
  createUserWithEmailAndPassword(auth,email.value,password.value)
    .then(()=>{
      msg.style.color = "#9ae6b4";
      msg.textContent = "✅ Account created! Now login.";
    })
    .catch(e=>{
      msg.style.color = "#ffb3b3";
      msg.textContent = "❌ " + e.message;
    });
};
</script>

</body>
</html>
